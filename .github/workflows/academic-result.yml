name: Academic Result from Issue

# Issue text is untrusted input. It is only ever used as inert frontmatter
# field values (see scripts/academic-result/) or passed through jq/file
# arguments below — never interpolated into a shell command via `${{ }}`.
on:
  issues:
    types: [opened]

concurrency:
  group: academic-result-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    name: Process Academic Result issue
    if: contains(github.event.issue.labels.*.name, 'academic-result')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Look up an existing pull request for this issue
        id: existing-pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: academic-result/issue-${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          pr_json=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH_NAME" --state all --json number,url,state --jq '.[0] // {}')
          {
            echo "number=$(echo "$pr_json" | jq -r '.number // empty')"
            echo "url=$(echo "$pr_json" | jq -r '.url // empty')"
            echo "state=$(echo "$pr_json" | jq -r '.state // empty')"
          } >> "$GITHUB_OUTPUT"

      - name: Decide what to do
        id: decide
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER_LOGIN: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          APPROVED_ACTORS: ${{ vars.ACADEMIC_RESULT_APPROVED_ACTORS }}
          EXISTING_PR_NUMBER: ${{ steps.existing-pr.outputs.number }}
          EXISTING_PR_URL: ${{ steps.existing-pr.outputs.url }}
          EXISTING_PR_STATE: ${{ steps.existing-pr.outputs.state }}
        run: |
          set -euo pipefail
          node scripts/academic-result/cli.ts > decision.json
          echo "status=$(jq -r '.status' decision.json)" >> "$GITHUB_OUTPUT"

      - name: Comment when unauthorized, invalid, or already processed
        if: steps.decide.outputs.status != 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          jq -r '.comment' decision.json > comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md

      - name: Create the branch and commit the Academic Result
        if: steps.decide.outputs.status == 'ready'
        run: |
          set -euo pipefail
          branch=$(jq -r '.branchName' decision.json)
          file_path=$(jq -r '.filePath' decision.json)
          git checkout -b "$branch"
          mkdir -p "$(dirname "$file_path")"
          jq -r '.fileContent' decision.json > "$file_path"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$file_path"
          jq -r '.commitMessage' decision.json | git commit -F -
          # Force-push is safe: this branch is bot-owned and its content is a
          # deterministic function of the issue, so re-pushing after a partial
          # prior run (branch created, PR step never ran) reproduces the same
          # result rather than overwriting anything else.
          git push --force origin "$branch"

      - name: Open the pull request
        if: steps.decide.outputs.status == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          branch=$(jq -r '.branchName' decision.json)
          jq -r '.prBody' decision.json > pr-body.md
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" \
            --title "$(jq -r '.prTitle' decision.json)" \
            --body-file pr-body.md \
            --base main \
            --head "$branch")
          printf 'Opened a pull request with this Academic Result: %s\n\nIt will not appear on the site until reviewed and merged (ADR 0001).\n' "$pr_url" > issue-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file issue-comment.md
