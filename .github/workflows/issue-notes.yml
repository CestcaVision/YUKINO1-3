name: Publish learning note from Issue

on:
  issues:
    types: [opened, edited, labeled, reopened]

concurrency:
  group: issue-note-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    if: >-
      github.event.issue.state == 'open' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      contains(github.event.issue.labels.*.name, 'notes') &&
      (contains(github.event.issue.labels.*.name, 'math') ||
       contains(github.event.issue.labels.*.name, 'economics') ||
       contains(github.event.issue.labels.*.name, 'physics') ||
       contains(github.event.issue.labels.*.name, 'cs'))
    environment: MIMO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate note with MiMo
        id: generate
        run: node scripts/generate-issue-note.ts
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_BASE_URL: ${{ vars.MIMO_BASE_URL || 'https://token-plan-cn.xiaomimimo.com/v1' }}
          MIMO_MODEL: ${{ vars.MIMO_MODEL || 'mimo-v2.6-flash' }}

      - name: Validate generated note
        if: steps.generate.outputs.changed == 'true'
        run: pnpm run build

      - name: Commit the validated note
        if: steps.generate.outputs.changed == 'true'
        env:
          NOTE_PATH: ${{ steps.generate.outputs.path }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$NOTE_PATH"
          git commit -m "content: publish learning note from issue #${ISSUE_NUMBER}"
          # Different Issues may finish together. Rebase only the generated-file commit.
          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH"
            pnpm run build
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
          done
          exit 1

      - name: Run CI and deploy GitHub Pages
        if: steps.generate.outputs.path != ''
        # GITHUB_TOKEN pushes do not trigger push workflows; workflow_dispatch does.
        # Also dispatch on an unchanged retry so a failed deployment is recoverable
        # without paying for another model response.
        run: gh workflow run ci.yml --ref "$DEFAULT_BRANCH" --repo "$GITHUB_REPOSITORY"
